<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In | maild</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      background-color: var(--md-bg); color: var(--md-text); font-family: var(--md-font-sans);
      background-image: linear-gradient(var(--md-border-light) 1px, transparent 1px), linear-gradient(90deg, var(--md-border-light) 1px, transparent 1px);
      background-size: 44px 44px; background-position: -1px -1px;
    }
    .auth-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: var(--md-space-4); }
    .auth-card { background: var(--md-surface); border: 2px solid var(--md-border); box-shadow: 8px 8px 0 var(--md-border); padding: 40px; width: 100%; max-width: 420px; }
    .auth-brand { font-family: var(--md-font-mono); font-size: 1.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: -0.02em; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
    .auth-brand::before { content: ""; width: 14px; height: 14px; background: var(--md-accent); display: inline-block; }
    .auth-brand a { color: var(--md-text); text-decoration: none; }
    .auth-title { font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; margin: 12px 0 8px; }
    .auth-sub { color: var(--md-muted); font-size: .95rem; margin: 0 0 32px; }
    .auth-form { display: flex; flex-direction: column; gap: 20px; }
    .auth-label { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--md-muted); }
    .auth-input { background: var(--md-surface); border: 2px solid var(--md-border); border-radius: 0; padding: 12px 14px; color: var(--md-text); font-size: 1rem; width: 100%; box-sizing: border-box; font-family: inherit; }
    .auth-input:focus { outline: none; border-color: var(--md-accent); }
    .auth-input::placeholder { color: var(--md-border-light); }
    .auth-error { background: #FFEBEA; border: 2px solid var(--md-error); padding: 12px 16px; color: var(--md-error); font-weight: 600; }
    .auth-button { background: var(--md-text); color: var(--md-surface); border: 2px solid var(--md-border); border-radius: 0; padding: 14px 24px; font-size: .95rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; width: 100%; box-shadow: 5px 5px 0 var(--md-border); transition: transform .08s, box-shadow .08s, background .15s; font-family: inherit; }
    .auth-button:hover { background: var(--md-accent); }
    .auth-button:active { transform: translate(2px,2px); box-shadow: 3px 3px 0 var(--md-border); }
    .auth-footer { text-align: center; color: var(--md-muted); font-size: .95rem; margin-top: 24px; }
    .auth-footer a { color: var(--md-text); text-decoration: none; font-weight: 700; }
    .auth-footer a:hover { color: var(--md-accent); }
    .auth-page-footer { padding: 24px; text-align: center; color: var(--md-muted); font-size: .85rem; font-family: var(--md-font-mono); }
    @media (max-width: 480px) {
      .auth-card { padding: 32px 24px; margin: 16px; }
    }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <p class="auth-brand"><a href="/">maild</a></p>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Log in to your account to continue.</p>
      <div id="error" class="auth-error" hidden></div>
      <form class="auth-form" id="loginForm">
        <div>
          <label class="auth-label" for="email">Email</label>
          <input class="auth-input" type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div>
          <label class="auth-label" for="password">Password</label>
          <input class="auth-input" type="password" id="password" name="password" placeholder="Your password" required>
        </div>
        <button type="submit" class="auth-button">Log In</button>
      </form>
      <p class="auth-footer">Don't have an account? <a href="/signup">Sign up</a></p>
    </div>
  </div>

  <footer class="auth-page-footer">
    <a href="/">maild</a> / 2026
  </footer>

  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      if (res.ok) {
        window.location.href = '/dashboard';
      } else {
        const data = await res.json();
        errorEl.textContent = data.error || 'Login failed';
        errorEl.hidden = false;
      }
    });
  </script>
</body>
</html>
